version: 2

sources:
  - name: crm_raw
    project: "{{ env_var('GCP_PROJECT_ID') }}"
    dataset: "{{ env_var('GCP_DATASET_ID', 'crm_raw') }}"
    description: >
      Raw HubSpot payloads landed by the Python extractor. One row per object,
      payload held as the exact JSON text the API returned.
    config:
      # If the nightly run stops firing, this is what says so out loud.
      loaded_at_field: ingested_at
      freshness:
        warn_after: {count: 26, period: hour}
        error_after: {count: 48, period: hour}
    tables:
      - name: raw_contacts
      - name: raw_companies
      - name: raw_deals
      - name: raw_deal_associations
