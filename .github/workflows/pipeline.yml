name: Run CRM Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Audit dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --progress-spinner off
      - run: pytest tests/ -v
      - name: Run pipeline
        env:
          HUBSPOT_API_KEY: ${{ secrets.HUBSPOT_API_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_DATASET_ID: ${{ vars.GCP_DATASET_ID || 'crm_raw' }}
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Live CRM sync skipped on pull_request."
            exit 0
          fi

          if [ -z "$HUBSPOT_API_KEY" ] || [ -z "$GCP_PROJECT_ID" ] || [ -z "$GCP_CREDENTIALS_JSON" ]; then
            echo "Live CRM sync skipped because one or more required secrets are not configured."
            exit 0
          fi

          credentials_file="$RUNNER_TEMP/gcp-credentials.json"
          printf '%s' "$GCP_CREDENTIALS_JSON" > "$credentials_file"
          chmod 600 "$credentials_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$credentials_file"

          python src/pipeline.py
